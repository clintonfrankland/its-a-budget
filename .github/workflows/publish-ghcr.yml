name: Publish to GHCR

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == 'clintonfrankland/its-a-budget' &&
      (
        (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') ||
        (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main')
      )
    runs-on: ubuntu-latest

    steps:
      - name: Check out tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read shipped semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_prefix="$(grep -oP '(?<=<VersionPrefix>)[^<]+(?=</VersionPrefix>)' ClintonFrankland.Blazor.csproj)"

          if [[ ! "$version_prefix" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VersionPrefix must be a MAJOR.MINOR.PATCH semantic version; found '$version_prefix'." >&2
            exit 1
          fi

          echo "value=$version_prefix" >> "$GITHUB_OUTPUT"

      - name: Check semantic-version tag availability
        id: collision
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          IMAGE_NAME: its-a-budget
          SEMVER_TAG: ${{ steps.version.outputs.value }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner } = context.repo;
            const packageName = process.env.IMAGE_NAME;
            const semanticVersion = process.env.SEMVER_TAG;
            const sourceSha = process.env.SOURCE_SHA;
            let packageVersions;

            try {
              packageVersions = await github.paginate(
                'GET /users/{username}/packages/{package_type}/{package_name}/versions',
                {
                  username: owner,
                  package_type: 'container',
                  package_name: packageName,
                  per_page: 100
                }
              );
            } catch (error) {
              if (error.status === 404) {
                core.info(`No existing GHCR package named ${packageName}; ${semanticVersion} is available.`);
                core.setOutput('should_publish', 'true');
                return;
              }

              throw error;
            }

            const matchingSemanticVersions = packageVersions.filter(version =>
              (version.metadata?.container?.tags ?? []).includes(semanticVersion)
            );
            const matchingSourceVersions = packageVersions.filter(version =>
              (version.metadata?.container?.tags ?? []).includes(sourceSha)
            );

            if (matchingSemanticVersions.length === 0 && matchingSourceVersions.length === 0) {
              core.info(`GHCR tags ${semanticVersion} and ${sourceSha} are available.`);
              core.setOutput('should_publish', 'true');
              return;
            }

            if (
              matchingSemanticVersions.length === 1 &&
              matchingSourceVersions.length === 1 &&
              matchingSemanticVersions[0].id === matchingSourceVersions[0].id
            ) {
              core.info(`GHCR tag ${semanticVersion} already belongs to ${sourceSha}; publication is already complete.`);
              core.setOutput('should_publish', 'false');
              return;
            }

            core.setFailed(
              `Refusing to overwrite existing GHCR tag ${semanticVersion} or ${sourceSha}. ` +
              `Bump VersionPrefix before publishing a different commit; do not reuse a tested commit SHA.`
            );

      - name: Set up Docker Buildx
        if: steps.collision.outputs.should_publish == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: steps.collision.outputs.should_publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        if: steps.collision.outputs.should_publish == 'true'
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/clintonfrankland/its-a-budget
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha }},priority=200
            type=raw,value=${{ steps.version.outputs.value }},priority=100
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.source=https://github.com/clintonfrankland/its-a-budget

      - name: Build and publish image
        if: steps.collision.outputs.should_publish == 'true'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Verify published tag digest
        if: steps.collision.outputs.should_publish == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          IMAGE_NAME: its-a-budget
          SEMVER_TAG: ${{ steps.version.outputs.value }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner } = context.repo;
            const packageName = process.env.IMAGE_NAME;
            const semanticVersion = process.env.SEMVER_TAG;
            const sourceSha = process.env.SOURCE_SHA;
            const expectedDigest = process.env.EXPECTED_DIGEST;
            const packageVersions = await github.paginate(
              'GET /users/{username}/packages/{package_type}/{package_name}/versions',
              {
                username: owner,
                package_type: 'container',
                package_name: packageName,
                per_page: 100
              }
            );
            const publishedVersions = packageVersions.filter(version => {
              const tags = version.metadata?.container?.tags ?? [];
              return tags.includes(semanticVersion) || tags.includes(sourceSha);
            });

            if (publishedVersions.length !== 1) {
              core.setFailed(
                `GHCR tags ${semanticVersion} and ${sourceSha} must identify one image; found ${publishedVersions.length}.`
              );
              return;
            }

            const publishedVersion = publishedVersions[0];
            const publishedTags = publishedVersion.metadata?.container?.tags ?? [];
            if (
              !publishedTags.includes(semanticVersion) ||
              !publishedTags.includes(sourceSha) ||
              publishedVersion.name !== expectedDigest
            ) {
              core.setFailed(
                `GHCR tags ${semanticVersion} and ${sourceSha} do not both reference build digest ${expectedDigest}.`
              );
              return;
            }

            core.info(`Verified GHCR tags ${semanticVersion} and ${sourceSha} reference ${expectedDigest}.`);
