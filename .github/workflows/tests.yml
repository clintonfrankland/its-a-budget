name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ClintonFrankland.Blazor.sln

      - name: Build
        run: dotnet build ClintonFrankland.Blazor.sln --no-restore

      - name: Test
        run: dotnet test ClintonFrankland.Blazor.sln --no-build
